<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  
  <!-- Character encoding and compatibility -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO and indexing -->
  <meta name="robots" content="noindex" />
  <meta name="description" content="Built with FlutterFlow." />
  
  <!-- App metadata -->
  <title>FARM</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.json">
  
  <!-- iOS web app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FARM">
  
  <!-- Theme colors -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d2428">
  
  <!-- Open Graph & Social Media -->
  <meta property="og:title" content="FARM" />
  <meta property="og:description" content="Built with FlutterFlow." />
  <meta property="og:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" />
  <meta name="twitter:title" content="FARM" />
  <meta name="twitter:description" content="Built with FlutterFlow." />
  <meta name="twitter:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    if (
      ['farmapp-e2145.web.app', 'farmapp-e2145.firebaseapp.com'].includes(
        window.location.hostname,
      ) &&
      (/^\/pay(?:\/|$)/.test(window.location.pathname) ||
        /^\/merchant-payment(?:\/|$)/.test(window.location.pathname))
    ) {
      window.location.replace(
        `https://farmpay.africa${window.location.pathname}${window.location.search}${window.location.hash}`,
      );
    }
  </script>
</head>
<body>
  <!-- Flutter app root -->
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
